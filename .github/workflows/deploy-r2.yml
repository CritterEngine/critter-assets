name: Deploy robot assets to R2

on:
  push:
    branches: [main]
    paths:
      - "robots/**"
      - "attachments/**"
      - "objects/**"
      - "scene/**"
      - "immutable_assets.json"
      - "scripts/plan_r2_deployment.py"
      - "scripts/validate_robot_assets.py"
      - ".github/r2-backfill-request"
      - ".github/workflows/deploy-r2.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Deployment scope"
        required: true
        default: "robot"
        type: choice
        options:
          - robot
          - all
      robot:
        description: "Robot directory name to redeploy"
        required: false
        default: "berkeley_humanoid"

permissions:
  contents: read

concurrency:
  group: deploy-production-robot-assets
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and upload
    runs-on: ubuntu-latest
    environment: production-assets
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: critter-library

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2

      - name: Select files and robot directories
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_ROBOT: ${{ inputs.robot }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          requested_mode = os.environ.get("REQUESTED_MODE", "")
          requested = os.environ.get("REQUESTED_ROBOT", "")
          full_backfill = False

          def git_files(*pathspecs: str) -> list[str]:
              output = subprocess.check_output(
                  ["git", "ls-files", "-z", "--", *pathspecs], text=False
              )
              return output.decode().split("\0")

          def all_deployable_files() -> list[str]:
              return git_files("robots", "attachments", "objects", "scene")

          if event_name == "workflow_dispatch":
              if requested_mode == "all":
                  paths = all_deployable_files()
                  full_backfill = True
              else:
                  directory = Path("robots") / requested
                  if not directory.is_dir() or directory.parent != Path("robots"):
                      raise SystemExit(f"Unknown robot directory: {requested}")
                  paths = git_files(str(directory))
          else:
              before = os.environ["BEFORE_SHA"]
              current = os.environ["CURRENT_SHA"]
              if before == "0" * 40:
                  paths = all_deployable_files()
                  full_backfill = True
              else:
                  try:
                      subprocess.run(
                          ["git", "cat-file", "-e", f"{before}^{{commit}}"],
                          check=True,
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                      )
                  except subprocess.CalledProcessError:
                      subprocess.run(
                          ["git", "fetch", "--no-tags", "--depth=1", "origin", before],
                          check=True,
                      )
                  output = subprocess.check_output(
                      [
                          "git",
                          "diff",
                          "--name-only",
                          "--diff-filter=ACMRTD",
                          "-z",
                          before,
                          current,
                          "--",
                          "robots",
                          "attachments",
                          "objects",
                          "scene",
                          ".github/r2-backfill-request",
                      ],
                      text=False,
                  )
                  paths = output.decode().split("\0")
                  if ".github/r2-backfill-request" in paths:
                      paths = all_deployable_files()
                      full_backfill = True

          paths = sorted(path for path in paths if path and Path(path).is_file())
          files = [path for path in paths if Path(path).is_file()]
          robot_directories = sorted(
              {
                  str(Path(*Path(path).parts[:2]))
                  for path in paths
                  if len(Path(path).parts) > 2 and Path(path).parts[0] == "robots"
              }
          )

          Path(".r2-deploy-files").write_text("\n".join(files), encoding="utf-8")
          Path(".r2-robot-directories").write_text(
              "\n".join(robot_directories), encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output_file:
              output_file.write(f"has_changes={'true' if files or robot_directories else 'false'}\n")
              output_file.write(
                  f"has_directories={'true' if robot_directories else 'false'}\n"
              )
              output_file.write(f"full_backfill={'true' if full_backfill else 'false'}\n")
          print(
              f"Selected {len(files)} files from {len(robot_directories)} robot directories "
              f"(full_backfill={full_backfill})"
          )
          PY

      - name: Validate local asset references
        if: steps.changes.outputs.has_directories == 'true' && steps.changes.outputs.full_backfill != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t directories < .r2-robot-directories
          python3 scripts/validate_robot_assets.py "${directories[@]}"

      - name: Plan stable and immutable uploads
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plan_r2_deployment.py \
            --changed-files .r2-deploy-files \
            --robot-directories .r2-robot-directories

      - name: Verify deployment credentials
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test "$R2_ENDPOINT" != "https://.r2.cloudflarestorage.com"
          aws --version

      - name: Upload stable assets
        if: steps.changes.outputs.has_changes == 'true' && steps.changes.outputs.full_backfill != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r source key; do
            test -n "$source" || continue
            content_type="$(file --brief --mime-type "$source")"
            aws s3 cp "$source" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "$content_type" \
              --cache-control "public,max-age=3600" \
              --no-progress
          done < .r2-deployment/stable-uploads.tsv

      - name: Backfill all stable assets
        if: steps.changes.outputs.full_backfill == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t immutable_robots < <(
            python3 -c 'import json; print("\n".join(json.load(open("immutable_assets.json"))["robots"]))'
          )
          robot_excludes=()
          for robot in "${immutable_robots[@]}"; do
            robot_excludes+=(--exclude "$robot/*")
          done
          aws s3 cp robots "s3://$R2_BUCKET/robots" \
            --recursive \
            "${robot_excludes[@]}" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=3600" \
            --no-progress
          for prefix in attachments objects scene; do
            test -d "$prefix" || continue
            aws s3 cp "$prefix" "s3://$R2_BUCKET/$prefix" \
              --recursive \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public,max-age=3600" \
              --no-progress
          done

      - name: Upload immutable asset releases
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r source key; do
            test -n "$source" || continue
            content_type="$(file --brief --mime-type "$source")"
            aws s3 cp "$source" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "$content_type" \
              --cache-control "public,max-age=31536000,immutable" \
              --no-progress
          done < .r2-deployment/immutable-uploads.tsv

      - name: Verify asset objects
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FULL_BACKFILL: ${{ steps.changes.outputs.full_backfill }}
        run: |
          set -euo pipefail
          verify_uploads() {
            local plan="$1"
            while IFS=$'\t' read -r source key; do
              test -n "$source" || continue
              local_size="$(stat --format=%s "$source")"
              remote_size="$(aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$R2_ENDPOINT" \
                --query ContentLength \
                --output text)"
              test "$local_size" = "$remote_size"
              curl --fail --silent --show-error --head \
                "https://assets.critterengine.com/$key" >/dev/null
            done < "$plan"
          }
          if [[ "$FULL_BACKFILL" == "true" ]]; then
            mapfile -t immutable_robots < <(
              python3 -c 'import json; print("\n".join(json.load(open("immutable_assets.json"))["robots"]))'
            )
            robot_excludes=()
            for robot in "${immutable_robots[@]}"; do
              robot_excludes+=(--exclude "$robot/*")
            done
            robot_diff="$(aws s3 sync robots "s3://$R2_BUCKET/robots" \
              --dryrun --size-only "${robot_excludes[@]}" --endpoint-url "$R2_ENDPOINT")"
            test -z "$robot_diff" || { echo "$robot_diff"; exit 1; }
            for prefix in attachments objects scene; do
              test -d "$prefix" || continue
              prefix_diff="$(aws s3 sync "$prefix" "s3://$R2_BUCKET/$prefix" \
                --dryrun --size-only --endpoint-url "$R2_ENDPOINT")"
              test -z "$prefix_diff" || { echo "$prefix_diff"; exit 1; }
            done
          else
            verify_uploads .r2-deployment/stable-uploads.tsv
          fi
          verify_uploads .r2-deployment/immutable-uploads.tsv

      - name: Publish immutable release manifests
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r source key; do
            test -n "$source" || continue
            aws s3 cp "$source" "s3://$R2_BUCKET/$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json" \
              --cache-control "public,max-age=60,must-revalidate" \
              --no-progress
            local_size="$(stat --format=%s "$source")"
            remote_size="$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --query ContentLength \
              --output text)"
            test "$local_size" = "$remote_size"
            curl --fail --silent --show-error --head \
              "https://assets.critterengine.com/$key" >/dev/null
          done < .r2-deployment/manifest-uploads.tsv
